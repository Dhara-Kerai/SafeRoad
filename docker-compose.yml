services:
  postgres:
    image: postgres:16-alpine
    container_name: saferoad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: saferoad
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saferoad"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: saferoad-ai-service
    restart: unless-stopped
    group_add:
      - "10001"
    environment:
      - PORT=8001
      - AI_INTERNAL_API_KEY=${AI_INTERNAL_API_KEY:?Set AI_INTERNAL_API_KEY in the root .env file}
      - UPLOADS_DIR=/app/uploads
    volumes:
      - backend_uploads:/app/uploads
      - ai_models:/app/models

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saferoad-backend
    restart: unless-stopped
    group_add:
      - "10001"
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@postgres:5432/saferoad?schema=public
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      - AI_SERVICE_URL=http://ai-service:8001
      - AI_INTERNAL_API_KEY=${AI_INTERNAL_API_KEY:?Set AI_INTERNAL_API_KEY in the root .env file}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api}
    container_name: saferoad-frontend
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
  ai_models:
