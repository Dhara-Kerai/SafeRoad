<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <!-- Metallic Body Shell Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="25%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Glass Cabin & Windshield Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>

    <!-- Roofline Sky Reflection Highlight -->
    <linearGradient id="roofHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#93c5fd" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#93c5fd" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Muscular Shoulder Contour Highlight -->
    <linearGradient id="shoulderHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.1" />
      <stop offset="20%" stop-color="#94a3b8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#94a3b8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.1" />
    </linearGradient>

    <!-- Tail Light Bloom Glow -->
    <filter id="tailGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Asphalt Ground Contact Shadow -->
  <ellipse cx="200" cy="188" rx="185" ry="10" fill="#000000" fill-opacity="0.75" />

  <!-- Tires & Wheels -->
  <!-- Left Wide Performance Tire -->
  <rect x="22" y="142" width="48" height="42" rx="9" fill="#05080e" stroke="#1e293b" stroke-width="2" />
  <rect x="30" y="150" width="12" height="28" rx="4" fill="#0f172a" />
  
  <!-- Right Wide Performance Tire -->
  <rect x="330" y="142" width="48" height="42" rx="9" fill="#05080e" stroke="#1e293b" stroke-width="2" />
  <rect x="358" y="150" width="12" height="28" rx="4" fill="#0f172a" />

  <!-- Main Aerodynamic Body Shell -->
  <path d="
    M 28,148 
    C 24,118 42,94 82,88 
    C 114,44 154,28 200,28 
    C 246,28 286,44 318,88 
    C 358,94 376,118 372,148 
    C 368,168 348,178 322,178 
    L 78,178 
    C 52,178 32,168 28,148 Z" 
    fill="url(#bodyGrad)" 
    stroke="#334155" 
    stroke-width="2" />

  <!-- Roofline Highlight Arc -->
  <path d="M 120,44 C 158,30 242,30 280,44" fill="none" stroke="url(#roofHighlight)" stroke-width="2.5" />

  <!-- Curved Rear Glass Windshield -->
  <path d="
    M 90,90 
    C 116,48 152,36 200,36 
    C 248,36 284,48 310,90 
    C 260,86 140,86 90,90 Z" 
    fill="url(#glassGrad)" 
    stroke="#475569" 
    stroke-width="1.5" />

  <!-- Interior Rear Headrests Silhouette in Glass -->
  <path d="M 148,82 C 148,72 166,72 166,82 Z" fill="#0f172a" />
  <path d="M 234,82 C 234,72 252,72 252,82 Z" fill="#0f172a" />

  <!-- Shoulder Character / Beltline Contour Line -->
  <path d="M 38,116 C 115,108 285,108 362,116" fill="none" stroke="url(#shoulderHighlight)" stroke-width="2" />

  <!-- Aerodynamic Side Mirrors -->
  <!-- Left Mirror -->
  <path d="M 66,93 C 38,88 34,100 60,106 Z" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
  <line x1="42" y1="96" x2="56" y2="99" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.8" />

  <!-- Right Mirror -->
  <path d="M 334,93 C 362,88 366,100 340,106 Z" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
  <line x1="358" y1="96" x2="344" y2="99" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.8" />

  <!-- Full-Width Continuous Slim Modern LED Tail Light Strip -->
  <!-- Main Light Bar Base -->
  <path d="M 44,120 C 110,116 290,116 356,120 L 354,126 C 290,122 110,122 46,126 Z" fill="#dc2626" filter="url(#tailGlow)" />
  <!-- Center Bright Core -->
  <path d="M 48,122 C 115,118 285,118 352,122" fill="none" stroke="#fca5a5" stroke-width="2" />

  <!-- High-Mount Center LED Stop Lamp -->
  <rect x="175" y="42" width="50" height="4" rx="2" fill="#ef4444" filter="url(#tailGlow)" />

  <!-- License Plate Recess Area -->
  <rect x="155" y="146" width="90" height="18" rx="4" fill="#05080e" stroke="#1e293b" stroke-width="1" />
  <rect x="165" y="150" width="70" height="10" rx="2" fill="#e2e8f0" />
  <rect x="175" y="153" width="50" height="4" rx="1" fill="#475569" fill-opacity="0.5" />

  <!-- Rear Bumper Diffuser Fins & Lower Accents -->
  <rect x="88" y="166" width="34" height="6" rx="2" fill="#030712" stroke="#1e293b" stroke-width="1" />
  <rect x="278" y="166" width="34" height="6" rx="2" fill="#030712" stroke="#1e293b" stroke-width="1" />
  <rect x="180" y="172" width="40" height="4" rx="1.5" fill="#030712" />
</svg>
