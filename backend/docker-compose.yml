version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: safroad-postgres
    environment:
      POSTGRES_DB: saferoad
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env before starting Compose}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
