name: SafeRoad CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-test:
    name: Backend Build & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: saferoad_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci --legacy-peer-deps

      - name: Push Database Schema
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/saferoad_test?schema=public
        run: |
          cd backend
          npx prisma db push

      - name: Compile Backend TypeScript
        run: |
          cd backend
          npm run build

      - name: Run Backend Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/saferoad_test?schema=public
          JWT_SECRET: ci-test-secret-key-saferoad-2026
          AI_SERVICE_URL: http://localhost:8001
          AI_INTERNAL_API_KEY: ci-test-internal-api-key-safe
        run: |
          cd backend
          npm test -- --passWithNoTests

  frontend-test:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Typecheck Frontend
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Frontend Production Asset Bundle
        run: |
          cd frontend
          npm run build

  ai-service-check:
    name: AI Service Syntax & Load Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install AI Service Dependencies
        run: |
          cd ai-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax & Imports
        run: |
          cd ai-service
          python -m py_compile main.py app/api/detection.py app/core/model_loader.py app/schemas/detection.py app/services/detection_service.py tests/test_model_loader.py

      - name: Run AI Unit Tests
        run: |
          cd ai-service
          python tests/test_model_loader.py
